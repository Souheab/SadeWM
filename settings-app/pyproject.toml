[project]
name = "sadesettings"
version = "0.1.0"
description = "PySide6 settings app for SADE"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "tomlkit>=0.12",
]

[project.scripts]
sadesettings = "sadesettings.main:main"

[tool.setuptools.package-data]
sadesettings = ["assets/*.qss"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
