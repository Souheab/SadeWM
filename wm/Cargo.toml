[package]
name = "sadewm"
version = "0.1.0"
edition = "2024"
description = "Rust implementation of the SADE X11 window manager"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
x11rb = { version = "0.13", features = ["shape", "randr", "xinerama", "sync", "dpms", "screensaver", "image"] }
tiny-skia = "0.11"
cosmic-text = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rustix = { version = "1", features = ["event", "fs", "process", "net"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"

